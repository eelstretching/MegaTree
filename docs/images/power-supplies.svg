<path d='M654 583V575H868V583' fill='none' stroke='#1f2328' stroke-width='1.75' stroke-linejoin='round'/>
<text x='24.0' y='737.0' font-size='11.5' font-weight='400' fill='#59636e' text-anchor='start'>Both bank boards hang off the same supply, so they share its +12 V and ground and need no tie between them. The rule is</text>
<text x='24.0' y='754.0' font-size='11.5' font-weight='400' fill='#59636e' text-anchor='start'>about two different supplies' +12 V. An arch group is the simplest case: one LRS-150-12 feeding one bank board.</text>
</svg>
