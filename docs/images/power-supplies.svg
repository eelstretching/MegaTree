<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 940 784' width='940' height='784' role='img' aria-label='How the supplies tie together: each supply feeds only its own bank board, the grounds all join, the +12 V rails never do' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13'>
