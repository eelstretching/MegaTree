<text x='698.0' y='117.0' font-size='10.5' font-weight='400' fill='#59636e' text-anchor='middle'>fused 12 V and ground from a spare circuit on block 1</text>
<text x='24.0' y='428.0' font-size='11.5' font-weight='400' fill='#59636e' text-anchor='start'>Each supply connects to its own block only, on its own 12 AWG pair. The ground tie, the ribbons and the Pico join every ground.</text>
<text x='24.0' y='445.0' font-size='11.5' font-weight='400' fill='#59636e' text-anchor='start'>An LRS-350 can draw 6.8 A from the wall at full load, so each cord feeds two supplies and the two cords go on different circuits.</text>
<text x='24.0' y='462.0' font-size='11.5' font-weight='400' fill='#59636e' text-anchor='start'>Lever nuts split each cord's line, neutral and earth to the supplies' AC/L, AC/N and FG terminals.</text>
