<text x='864.0' y='292.0' font-size='11.5' font-weight='400' fill='#59636e' text-anchor='middle'>12 to 5 V buck</text>
<path d='M640 136V122H882V136' fill='none' stroke='#cf222e' stroke-width='1.75' stroke-linejoin='round'/>
<path d='M654 136V128H868V136' fill='none' stroke='#1f2328' stroke-width='1.75' stroke-linejoin='round'/>
<text x='761.0' y='117.0' font-size='10.5' font-weight='400' fill='#59636e' text-anchor='middle'>12 V through the extra PTC on bank board 1, and ground</text>
<text x='24.0' y='428.0' font-size='11.5' font-weight='400' fill='#59636e' text-anchor='start'>Each supply connects to its own bank board only, on its own 12 AWG pair. The ground tie, the ribbons and the Pico join every ground.</text>
<text x='24.0' y='445.0' font-size='11.5' font-weight='400' fill='#59636e' text-anchor='start'>Box 1 holds supplies 1-2, banks 1-2 and the Pico board; box 2 holds supplies 3-4 and banks 3-4.</text>
<text x='24.0' y='462.0' font-size='11.5' font-weight='400' fill='#59636e' text-anchor='start'>Ribbons 3-4 and the ground tie between supplies 2 and 3 run from box to box through a 1-1/4 in conduit link.</text>
<text x='24.0' y='479.0' font-size='11.5' font-weight='400' fill='#59636e' text-anchor='start'>An LRS-350 can draw 6.8 A from the wall at full load, so each cord feeds two supplies and the two cords go on different circuits.</text>
<text x='24.0' y='496.0' font-size='11.5' font-weight='400' fill='#59636e' text-anchor='start'>Lever nuts split each cord's line, neutral and earth to the supplies' AC/L, AC/N and FG terminals.</text>
<line x1='24' x2='916' y1='515' y2='515' stroke='#d0d7de'/>
<text x='24.0' y='543.0' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Mini tree: one LRS-350-12 feeding two banks</text>
