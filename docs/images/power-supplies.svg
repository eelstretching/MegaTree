<text x='24.0' y='703.0' font-size='11.5' font-weight='400' fill='#59636e' text-anchor='start'>Both blocks hang off the same supply, so they share its +12 V and ground and need no tie between them. The rule is about two</text>
<text x='24.0' y='720.0' font-size='11.5' font-weight='400' fill='#59636e' text-anchor='start'>different supplies' +12 V. An arch group is the simplest case: one LRS-150-12, one 6-way block, one bank board.</text>
