<text x='24.0' y='30.0' font-size='15' font-weight='600' fill='#1f2328' text-anchor='start'>How the supplies tie together</text>
<text x='24.0' y='50.0' font-size='11.5' font-weight='400' fill='#59636e' text-anchor='start'>Each supply feeds only its own fuse block. All the grounds join into one; the +12 V rails never do.</text>
