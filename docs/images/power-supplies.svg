<text x='465.0' y='147.0' font-size='10.5' font-weight='400' fill='#59636e' text-anchor='middle'>12 AWG pair</text>
<text x='751.0' y='155.0' font-size='10.5' font-weight='400' fill='#59636e' text-anchor='middle'>ribbon</text>
<text x='368.0' y='202.0' font-size='10.5' font-weight='400' fill='#1f2328' text-anchor='start'>ground tie: 12 AWG from each supply's spare −V terminal to the next</text>
<text x='465.0' y='274.0' font-size='10.5' font-weight='600' fill='#cf222e' text-anchor='middle'>the +12 V rails never join</text>
