<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 500' width='760' height='500' role='img' aria-label='Every strand gets one 3-wire cable: fused 12 V, data and ground' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13'>
<rect width='760' height='500' fill='#ffffff'/>
